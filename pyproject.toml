[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hrh"
version = "0.1.0"
description = "The Heraclitean Representation Hypothesis: brain alignment is set by the objective, not by scale"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
models = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0", "transformers>=4.53", "pillow"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["hrh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
